# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# Development dependencies are included in the dependency graph by default so
# security checks cover the complete workspace.

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    # CDLA-Permissive-2.0 covers only the Mozilla CA certificate *data* in
    # webpki-roots (the Rust code is ISC-licensed). It is an SPDX-recognized
    # permissive license, compatible with Apache-2.0 dependents.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
# Acknowledged duplicates that cannot be unified from this workspace
# (each is pinned by an upstream crate; exact versions force re-review
# on the next bump instead of silently accepting drift):
skip = [
    # getrandom 0.3/0.4 come only from the dev-only proptest chain
    # (rand 0.9, tempfile); production uses 0.2 (uuid, ring, gateway).
    { name = "getrandom", version = "=0.3.4" },
    { name = "getrandom", version = "=0.4.3" },
    # hashbrown 0.14 is pinned by rusqlite 0.31 via hashlink 0.9;
    # 0.17 arrives via indexmap (h2, toml).
    { name = "hashbrown", version = "=0.14.5" },
    # windows-sys 0.52 is pinned by ring 0.17 (via rustls);
    # 0.61 arrives via the clap/anstream chain.
    { name = "windows-sys", version = "=0.52.0" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
