# Release workflow — builds checksummed artifacts for all platforms
# Triggered by pushing a tag matching v*
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build release
        run: cargo build --release --workspace --all-features

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Copy the CLI binary (the primary deliverable)
          cp target/release/kavach${{ matrix.suffix }} dist/kavach-${{ matrix.target }}${{ matrix.suffix }}
          # Generate SHA-256 checksum
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile kavach-${{ matrix.target }}${{ matrix.suffix }} SHA256 > kavach-${{ matrix.target }}.sha256
          else
            sha256sum kavach-${{ matrix.target }}${{ matrix.suffix }} > kavach-${{ matrix.target }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kavach-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
